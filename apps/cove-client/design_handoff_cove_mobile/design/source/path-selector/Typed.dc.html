<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Typing a path</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@font-face{font-family:"Phosphor";src:url("/_blob/c1e911a4fba32fa878e58d81ba387962") format("truetype");font-display:block}
@font-face{font-family:"Phosphor-Fill";src:url("/_blob/0767920c036d5365613a18ca28f65a30") format("truetype");font-display:block}
.ph{font-family:"Phosphor";font-style:normal;font-weight:normal;line-height:1;display:inline-block}
.phf{font-family:"Phosphor-Fill";font-style:normal;font-weight:normal;line-height:1;display:inline-block}
button{font:inherit;color:inherit;cursor:pointer}
input::placeholder{color:rgba(233,233,237,0.4)}
a{color:#d2cefd}a:hover{color:#e7e5fe}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #161826; color: #e9e9ed; font-family: Inter, system-ui, sans-serif">
  <div style="position: absolute; inset: 0; background: rgba(41,43,49,0.6)"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; top: 96px; background: #232532; border-radius: 22px 22px 0 0; display: flex; flex-direction: column">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: #595d6c; margin: 10px auto 6px; flex: none"></div>
    <div style="display: flex; align-items: center; padding: 0 8px; flex: none">
      <a href="Browse.dc.html" aria-label="Back to folders" style="width: 44px; height: 44px; display: grid; place-items: center; font-size: 18px; color: #e9e9ed; text-decoration: none"><span class="ph">&#xe138;</span></a>
      <span style="font-size: 17px; font-weight: 500">Path</span>
    </div>
    <div style="flex: 1; overflow-y: auto; padding: 0 16px 16px; display: flex; flex-direction: column">
      <div style="margin-top: 6px; display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; background: rgba(233,233,237,0.05); font-size: 12.5px; line-height: 1.5; color: rgba(233,233,237,0.72)">
        <span class="ph" style="font-size: 16px; margin-top: 1px; color: #d2cefd">&#xe308;</span>
        <span>This account can’t browse folders (that needs the Files or Library scan permission). Type a path inside a library folder; Cove still checks it.</span>
      </div>
      <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(233,233,237,0.5); margin: 16px 0 8px">Match</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button style="height: 34px; padding: 0 12px; border-radius: 999px; border: 0; background: #423a6a; color: #f5f4ff; font-size: 13px; display: flex; align-items: center; gap: 6px"><span class="ph" style="font-size: 14px">&#xe24a;</span>In folder</button>
        <button style="height: 34px; padding: 0 12px; border-radius: 999px; border: 0; background: transparent; box-shadow: inset 0 0 0 1px rgba(233,233,237,0.16); font-size: 13px">Not in folder</button>
        <button style="height: 34px; padding: 0 12px; border-radius: 999px; border: 0; background: transparent; box-shadow: inset 0 0 0 1px rgba(233,233,237,0.16); font-size: 13px">Contains text</button>
        <button style="height: 34px; padding: 0 12px; border-radius: 999px; border: 0; background: transparent; box-shadow: inset 0 0 0 1px rgba(233,233,237,0.16); font-size: 13px">Regex</button>
      </div>
      <label style="font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(233,233,237,0.5); margin: 18px 0 8px" for="path">Folder path</label>
      <div style="height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 8px; box-shadow: inset 0 0 0 1px #9184d9">
        <span class="ph" style="font-size: 16px; color: rgba(233,233,237,0.55)">&#xe24a;</span>
        <input id="path" value="{{ text }}" onInput="{{ setText }}" placeholder="/mnt/nas/Videos/…" autocomplete="off" spellcheck="false" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #e9e9ed; font: 400 14px ui-monospace, Menlo, monospace">
        <sc-if value="{{ hasText }}" hint-placeholder-val="{{ true }}"><button onClick="{{ clear }}" aria-label="Clear" style="width: 28px; height: 28px; border: 0; background: transparent; display: grid; place-items: center; color: rgba(233,233,237,0.45); font-size: 16px"><span class="phf">&#xe4f8;</span></button></sc-if>
      </div>
      <div style="{{ statusStyle }}"><span class="{{ statusIconClass }}" style="font-size: 14px">{{ statusIcon }}</span><span>{{ status }}</span></div>
      <sc-if value="{{ hasSug }}" hint-placeholder-val="{{ true }}">
        <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(233,233,237,0.5); margin: 16px 0 6px">Folders here</div>
      </sc-if>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <sc-for list="{{ sug }}" as="s" hint-placeholder-count="3">
          <button onClick="{{ s.pick }}" style="min-height: 52px; padding: 6px 10px; border: 0; border-radius: 8px; background: transparent; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left">
            <span class="ph" style="font-size: 18px; color: #9184d9">&#xe24a;</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 15px"><span style="color: #d2cefd">{{ s.hit }}</span>{{ s.rest }}</span>
              <span style="font-size: 12px; color: rgba(233,233,237,0.55)">{{ s.meta }}</span>
            </span>
            <span class="ph" style="font-size: 14px; color: rgba(233,233,237,0.45)">&#xe046;</span>
          </button>
        </sc-for>
      </div>
    </div>
    <div style="padding: 12px 16px 30px; box-shadow: 0 -1px 0 rgba(233,233,237,0.16); flex: none">
      <button style="{{ addStyle }}">Add condition</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const FOLDERS = [
  ['/mnt/nas/Videos', 3904], ['/mnt/nas/Videos/Drone', 612], ['/mnt/nas/Videos/Drone/2022', 148],
  ['/mnt/nas/Videos/Drone/2023', 187], ['/mnt/nas/Videos/Drone/2024', 277], ['/mnt/nas/Videos/Family', 1240],
  ['/mnt/nas/Videos/Timelapses', 206], ['/mnt/nas/Videos/Unsorted', 1846],
  ['/mnt/archive', 908], ['/mnt/archive/DVD rips', 540], ['/mnt/archive/Tapes', 368]
];
const ROOTS = ['/mnt/nas/Videos', '/mnt/archive'];
const fmt = n => n.toLocaleString('en-US');

class Component extends DCLogic {
  state = { text: '/mnt/nas/Videos/Dr' };
  renderVals() {
    const t = this.state.text;
    const cut = t.lastIndexOf('/');
    const parent = cut > 0 ? t.slice(0, cut) : '';
    const partial = t.slice(cut + 1).toLowerCase();
    // Suggestions: the folders right under the typed parent whose name starts with what follows the last slash.
    const sug = FOLDERS.filter(([p]) => {
      const c = p.lastIndexOf('/');
      return p.slice(0, c).toLowerCase() === parent.toLowerCase() && p.slice(c + 1).toLowerCase().startsWith(partial) && p.length > parent.length;
    }).map(([p, n]) => {
      const name = p.slice(p.lastIndexOf('/') + 1);
      const kids = FOLDERS.filter(([q]) => q.startsWith(p + '/') && q.slice(p.length + 1).indexOf('/') < 0).length;
      return { hit: name.slice(0, partial.length), rest: name.slice(partial.length),
        meta: fmt(n) + ' videos' + (kids ? ' · ' + kids + ' folders' : ''),
        pick: () => this.setState({ text: p + (kids ? '/' : '') }) };
    });
    const exact = FOLDERS.find(([p]) => p.toLowerCase() === t.replace(/\/+$/, '').toLowerCase());
    const inside = ROOTS.some(r => t.toLowerCase().startsWith(r.toLowerCase()));
    let status, ok;
    if (!t.trim()) { status = 'Library folders: ' + ROOTS.join(', '); ok = null; }
    else if (exact) { status = 'Folder found · ' + fmt(exact[1]) + ' videos, its subfolders included'; ok = true; }
    else if (inside) { status = 'Inside a library folder; no folder by that name yet'; ok = false; }
    else { status = 'Not inside a library folder: nothing would match'; ok = false; }
    return {
      text: t, hasText: !!t, sug, hasSug: sug.length > 0,
      setText: e => this.setState({ text: e.target.value }),
      clear: () => this.setState({ text: '' }),
      status,
      statusIcon: ok ? '' : ok === false ? '' : '',
      statusIconClass: ok ? 'phf' : 'ph',
      statusStyle: 'margin-top: 8px; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: ' + (ok ? '#d2cefd' : 'rgba(233,233,237,0.55)'),
      addStyle: 'width: 100%; height: 50px; border-radius: 8px; background: transparent; font-size: 15px; font-weight: 500; ' +
        (ok ? 'border: 1px solid #9184d9; color: #e7e5fe' : 'border: 1px solid rgba(233,233,237,0.16); color: rgba(233,233,237,0.4)')
    };
  }
}
</script>
</body>
</html>
