<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Folder browser</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@font-face{font-family:"Phosphor";src:url("/_blob/c1e911a4fba32fa878e58d81ba387962") format("truetype");font-display:block}
@font-face{font-family:"Phosphor-Fill";src:url("/_blob/0767920c036d5365613a18ca28f65a30") format("truetype");font-display:block}
.ph{font-family:"Phosphor";font-style:normal;font-weight:normal;line-height:1;display:inline-block}
.phf{font-family:"Phosphor-Fill";font-style:normal;font-weight:normal;line-height:1;display:inline-block}
button{font:inherit;color:inherit;cursor:pointer}
input::placeholder{color:rgba(233,233,237,0.4)}
a{color:#d2cefd}a:hover{color:#e7e5fe}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #161826; color: #e9e9ed; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="height: 44px; flex: none"></div>
  <div style="padding: 4px 12px 0; display: flex; align-items: center; gap: 6px; flex: none">
    <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: grid; place-items: center; font-size: 20px; color: #e9e9ed; text-decoration: none"><span class="ph">&#xe138;</span></a>
    <span style="flex: 1; font-size: 17px; font-weight: 500">Choose a folder</span>
    <a href="Typed.dc.html" style="padding: 0 10px; height: 44px; display: flex; align-items: center; gap: 6px; font-size: 14px; color: #d2cefd; text-decoration: none"><span class="ph" style="font-size: 16px">&#xe7d8;</span>Type path</a>
  </div>
  <div style="padding: 6px 16px 0; display: flex; align-items: center; gap: 2px; overflow-x: auto; white-space: nowrap; flex: none">
    <sc-for list="{{ crumbs }}" as="c" hint-placeholder-count="3">
      <sc-if value="{{ c.sep }}" hint-placeholder-val="{{ false }}"><span class="ph" style="font-size: 11px; color: rgba(233,233,237,0.45); padding: 0 2px">&#xe13a;</span></sc-if>
      <button onClick="{{ c.pick }}" style="{{ c.style }}"><sc-if value="{{ c.root }}" hint-placeholder-val="{{ false }}"><span class="ph" style="font-size: 15px">&#xe2a0;</span></sc-if>{{ c.label }}</button>
    </sc-for>
  </div>
  <div style="padding: 10px 16px 6px; flex: none">
    <label style="height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(233,233,237,0.16)">
      <span class="ph" style="font-size: 16px; color: rgba(233,233,237,0.55)">&#xe30c;</span>
      <input aria-label="Filter folders" value="{{ q }}" onInput="{{ setQ }}" placeholder="{{ placeholder }}" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #e9e9ed; font: 400 15px Inter, system-ui, sans-serif">
    </label>
  </div>
  <div style="flex: 1; overflow-y: auto; padding: 6px 16px 16px; display: flex; flex-direction: column; gap: 4px">
    <sc-if value="{{ atRoot }}" hint-placeholder-val="{{ true }}">
      <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(233,233,237,0.5); margin: 4px 4px 6px">Library folders on Living Room NAS</div>
    </sc-if>
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
      <button onClick="{{ r.press }}" style="{{ r.rowStyle }}">
        <span style="{{ r.tileStyle }}"><span class="{{ r.iconClass }}">{{ r.icon }}</span></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; text-align: left">
          <span style="{{ r.nameStyle }}">{{ r.name }}</span>
          <span style="font-size: 12px; color: rgba(233,233,237,0.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.meta }}</span>
        </span>
        <sc-if value="{{ r.kids }}" hint-placeholder-val="{{ true }}"><span class="ph" style="font-size: 16px; color: rgba(233,233,237,0.45)">&#xe13a;</span></sc-if>
        <sc-if value="{{ r.leaf }}" hint-placeholder-val="{{ false }}"><span style="{{ r.radioStyle }}"><span style="{{ r.dotStyle }}"></span></span></sc-if>
      </button>
    </sc-for>
    <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
      <div style="padding: 28px 12px; text-align: center; font-size: 13px; color: rgba(233,233,237,0.55)">No folder here matches “{{ q }}”.</div>
    </sc-if>
  </div>
  <div style="padding: 12px 16px 30px; box-shadow: 0 -1px 0 rgba(233,233,237,0.16); display: flex; flex-direction: column; gap: 8px; flex: none">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: rgba(233,233,237,0.55); min-height: 18px">
      <span class="ph" style="font-size: 14px">&#xe67c;</span><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ hint }}</span>
    </div>
    <button onClick="{{ use }}" style="{{ useStyle }}">{{ useLabel }}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const TREE = [
  { name: 'Videos', path: '/mnt/nas/Videos', n: 3904, kids: [
    { name: 'Drone', n: 612, kids: [
      { name: '2022', n: 148 },
      { name: '2023', n: 187 },
      { name: '2024', n: 277, kids: [ { name: 'Coast', n: 96 }, { name: 'Fjords', n: 121 }, { name: 'Night', n: 60 } ] }
    ] },
    { name: 'Family', n: 1240, kids: [ { name: 'Birthdays', n: 310 }, { name: 'Holidays', n: 702 }, { name: 'School', n: 228 } ] },
    { name: 'Timelapses', n: 206 },
    { name: 'Unsorted', n: 1846 }
  ] },
  { name: 'Archive', path: '/mnt/archive', n: 908, kids: [ { name: 'DVD rips', n: 540 }, { name: 'Tapes', n: 368 } ] }
];
const MUTED = 'rgba(233,233,237,0.55)';
const fmt = n => n.toLocaleString('en-US');

class Component extends DCLogic {
  state = { path: [0, 0], sel: null, q: '', picked: null };
  renderVals() {
    const s = this.state;
    const nodes = [];
    let list = TREE;
    for (const i of s.path) { const node = list[i]; nodes.push(node); list = node.kids || []; }
    const cur = nodes[nodes.length - 1] || null;
    const fullPath = (chain) => chain.length ? chain[0].path + chain.slice(1).map(x => '/' + x.name).join('') : '';
    const q = s.q.trim().toLowerCase();
    const visible = list.map((node, i) => ({ node, i })).filter(x => !q || x.node.name.toLowerCase().includes(q));
    const atRoot = s.path.length === 0;
    const rows = visible.map(({ node, i }) => {
      const kids = !!(node.kids && node.kids.length);
      const on = s.sel === i;
      return {
        name: node.name,
        meta: atRoot ? node.path + ' · ' + fmt(node.n) + ' videos' : fmt(node.n) + ' videos' + (kids ? ' · ' + node.kids.length + ' folders' : ''),
        icon: atRoot ? '' : '',
        iconClass: on ? 'phf' : 'ph',
        kids, leaf: !kids,
        press: () => kids ? this.setState({ path: [...s.path, i], sel: null, q: '' }) : this.setState({ sel: on ? null : i }),
        rowStyle: 'min-height: 64px; padding: 10px 12px; border: 0; border-radius: 8px; display: flex; align-items: center; gap: 12px; width: 100%; ' +
          (on ? 'background: color-mix(in srgb, #9184d9 9%, #232532); box-shadow: inset 0 0 0 1px #9184d9, 0 0 24px rgba(145,132,217,0.22)' : 'background: #232532; box-shadow: none'),
        tileStyle: 'width: 40px; height: 40px; border-radius: 8px; flex: none; display: grid; place-items: center; font-size: 20px; color: #9184d9; background: rgba(145,132,217,0.14)',
        nameStyle: 'font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (on ? '#d2cefd' : '#e9e9ed'),
        radioStyle: 'width: 20px; height: 20px; border-radius: 50%; flex: none; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px ' + (on ? '#9184d9' : 'rgba(233,233,237,0.16)'),
        dotStyle: 'width: 10px; height: 10px; border-radius: 50%; background: ' + (on ? '#9184d9' : 'transparent')
      };
    });
    const crumbs = [{ label: 'Library', root: true, sep: false, depth: 0 }, ...nodes.map((n, k) => ({ label: n.name, root: false, sep: true, depth: k + 1 }))]
      .map((c, k, all) => ({ ...c,
        pick: () => this.setState({ path: s.path.slice(0, c.depth), sel: null, q: '' }),
        style: 'height: 32px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; display: flex; align-items: center; gap: 6px; font-size: 13px; color: ' + (k === all.length - 1 ? '#d2cefd' : MUTED)
      }));
    const target = s.sel !== null ? list[s.sel] : cur;
    const targetChain = s.sel !== null ? [...nodes, list[s.sel]] : nodes;
    const subCount = target && target.kids ? target.kids.length : 0;
    const enabled = !!target;
    return {
      crumbs, rows, atRoot, q: s.q,
      empty: rows.length === 0,
      placeholder: atRoot ? 'Filter library folders' : 'Filter folders in ' + cur.name,
      setQ: (e) => this.setState({ q: e.target.value, sel: null }),
      hint: !target ? 'Pick a library folder to start' :
        fullPath(targetChain) + (subCount ? ' · and its ' + subCount + ' subfolders' : ''),
      useLabel: target ? 'Use “' + target.name + '” · ' + fmt(target.n) + ' videos' : 'Choose a folder',
      use: () => {},
      useStyle: 'width: 100%; height: 50px; border-radius: 8px; background: transparent; font-size: 15px; font-weight: 500; ' +
        (enabled ? 'border: 1px solid #9184d9; color: #e7e5fe' : 'border: 1px solid rgba(233,233,237,0.16); color: rgba(233,233,237,0.4)')
    };
  }
}
</script>
</body>
</html>
