org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental compile fails when a plugin's sources (the pub cache) and the build are on different drives
# (Windows: C: and D:): "Could not close incremental caches"
kotlin.incremental=false
# Cronet (cronet_http, from Google Play services) is two libraries with one namespace (org.chromium.net:cronet-api and
# cronet-shared); AGP 9 refuses that unless this is off
android.uniquePackageNames=false
