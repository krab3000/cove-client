buildscript {
  ext.Libav = [
    kotlinVersion: "2.1.20",
    minSdkVersion: 26, // AAudio
    compileSdkVersion: 36,
    ndkVersion: "27.1.12297006"
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return Libav[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.12.0"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

apply plugin: "com.facebook.react"

// rn-trace, when the app has it: libav's trace points record into its librntrace (Prefab), the tracer the app's
// JavaScript and other native code use too. Without it they compile to nothing.
def rnTrace = rootProject.findProject(":rn-trace")

// FFmpeg built by scripts/ffmpeg-android (yarn build-ffmpeg-android); its .so files ship in the app next to ours.
def ffmpegAbis = ["arm64-v8a"]
def ffmpegDir = file("../third_party/ffmpeg")
def ffmpegJniLibs = new File(buildDir, "ffmpeg-jniLibs")
// libmpv (scripts/mpv-android: third_party/mpv) and the libavfilter it needs: debug builds only (the engine "mpv",
// loaded at run time; release builds have libav alone). Skipped when third_party/mpv has no build.
def mpvDir = file("../third_party/mpv")
// -PlibavEngine=mpv: mpv in release builds too, as the default engine (LibavCacheModule.getDefaultEngine).
def defaultEngine = (rootProject.findProperty("libavEngine") ?: "libav").toString()
def mpvJniLibs = new File(buildDir, "mpv-jniLibs")

android {
  namespace "com.libav"

  compileSdkVersion getExtOrDefault("compileSdkVersion")
  ndkVersion getExtOrDefault("ndkVersion")

  defaultConfig {
    minSdkVersion Math.max(26, getExtOrDefault("minSdkVersion") as int)
    ndk {
      abiFilters(*ffmpegAbis)
    }
    buildConfigField "String", "DEFAULT_ENGINE", "\"${defaultEngine}\""
    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_shared", "-DLIBAV_RNTRACE=${rnTrace != null ? 'ON' : 'OFF'}"
      }
    }
  }

  buildFeatures {
    prefab rnTrace != null
    buildConfig true
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
      version "3.22.1"
    }
  }

  sourceSets {
    main {
      jniLibs.srcDirs += [ffmpegJniLibs]
    }
    debug {
      jniLibs.srcDirs += [mpvJniLibs]
    }
    if (defaultEngine == "mpv") {
      release {
        jniLibs.srcDirs += [mpvJniLibs]
      }
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

tasks.register("copyFFmpegLibs", Copy) {
  ffmpegAbis.each { abi ->
    from(new File(ffmpegDir, "android-${abi}/lib")) {
      include "*.so"
      exclude "libavfilter.so" // libmpv's (copyMpvLibs)
      into abi
    }
  }
  into ffmpegJniLibs
  doFirst {
    ffmpegAbis.each { abi ->
      if (!new File(ffmpegDir, "android-${abi}/lib/libavcodec.so").exists()) {
        throw new GradleException("FFmpeg for Android (${abi}) not found in ${ffmpegDir}. Run: yarn build-ffmpeg-android")
      }
    }
  }
}
preBuild.dependsOn "copyFFmpegLibs"

tasks.register("copyMpvLibs", Copy) {
  ffmpegAbis.each { abi ->
    if (new File(mpvDir, "android-${abi}/lib/libmpv.so").exists()) {
      from(new File(mpvDir, "android-${abi}/lib")) {
        include "libmpv.so"
        into abi
      }
      from(new File(ffmpegDir, "android-${abi}/lib")) {
        include "libavfilter.so"
        into abi
      }
    }
  }
  into mpvJniLibs
}
preBuild.dependsOn "copyMpvLibs"

dependencies {
  implementation "com.facebook.react:react-android"
  if (rnTrace != null) {
    implementation rnTrace
  }
}
