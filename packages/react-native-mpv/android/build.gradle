buildscript {
  ext.Mpv = [
    kotlinVersion: "2.1.20",
    minSdkVersion: 26, // mpv's hardware decoding into OpenGL (AImageReader, AHardwareBuffer)
    compileSdkVersion: 36,
    ndkVersion: "27.1.12297006"
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return Mpv[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.12.0"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

apply plugin: "com.facebook.react"

// rn-trace, when the app has it: the player's trace points record into its librntrace (Prefab), the tracer the app's
// JavaScript and other native code use too. Without it they compile to nothing.
def rnTrace = rootProject.findProject(":rn-trace")

// libmpv and the FFmpeg it links, built by scripts/mpv-android (yarn build-mpv-android): their .so files ship in the
// app next to ours.
def nativeAbis = ["arm64-v8a"]
def ffmpegDir = file("../third_party/ffmpeg")
def mpvDir = file("../third_party/mpv")
def nativeJniLibs = new File(buildDir, "mpv-jniLibs")

android {
  namespace "com.rnmpv"

  compileSdkVersion getExtOrDefault("compileSdkVersion")
  ndkVersion getExtOrDefault("ndkVersion")

  defaultConfig {
    minSdkVersion Math.max(26, getExtOrDefault("minSdkVersion") as int)
    ndk {
      abiFilters(*nativeAbis)
    }
    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_shared", "-DMPV_RNTRACE=${rnTrace != null ? 'ON' : 'OFF'}"
      }
    }
  }

  buildFeatures {
    prefab rnTrace != null
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
      version "3.22.1"
    }
  }

  sourceSets {
    main {
      jniLibs.srcDirs += [nativeJniLibs]
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

tasks.register("copyNativeLibs", Copy) {
  nativeAbis.each { abi ->
    from(new File(ffmpegDir, "android-${abi}/lib")) {
      include "*.so"
      into abi
    }
    from(new File(mpvDir, "android-${abi}/lib")) {
      include "libmpv.so"
      into abi
    }
  }
  into nativeJniLibs
  doFirst {
    nativeAbis.each { abi ->
      if (!new File(mpvDir, "android-${abi}/lib/libmpv.so").exists() ||
          !new File(ffmpegDir, "android-${abi}/lib/libavcodec.so").exists()) {
        throw new GradleException("libmpv / FFmpeg for Android (${abi}) not found in ${mpvDir.parent}. Run: yarn build-mpv-android")
      }
    }
  }
}
preBuild.dependsOn "copyNativeLibs"

dependencies {
  implementation "com.facebook.react:react-android"
  if (rnTrace != null) {
    implementation rnTrace
  }
}
